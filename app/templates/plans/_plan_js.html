<script>
(function () {
    // Chọn xong một địa điểm trong ô tìm kiếm thì lọc luôn
    var plSearch = document.getElementById('plSearch');
    if (plSearch) plSearch.addEventListener('change', function () { if (window.GesPlace && GesPlace.code(plSearch) && plSearch.form) plSearch.form.submit(); });
    const AUTH = {{ 'true' if current_user.is_authenticated else 'false' }};
    const csrf = () => document.querySelector('meta[name="csrf-token"]')?.content || '';
    const $ = (s, r) => (r || document).querySelector(s);
    const panelEl = $('#planPanel'), shareEl = $('#planShare');
    const panel = new bootstrap.Modal(panelEl), share = new bootstrap.Modal(shareEl);
    let shareId = null, shareAttach = false;

    function needLogin() { location.href = '{{ url_for("auth.login") }}'; }
    async function post(url, body) {
        const r = await fetch(url, { method: 'POST', credentials: 'same-origin',
            headers: { 'X-CSRFToken': csrf(), 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: body ? JSON.stringify(body) : '{}' });
        let j = {}; try { j = await r.json(); } catch (e) {}
        return { ok: r.ok, status: r.status, data: j };
    }

    async function openPanel(id, focusComments) {
        const body = $('#planPanelBody');
        body.innerHTML = '<div class="text-center py-5 text-muted">Đang tải...</div>';
        panel.show();
        try {
            const r = await fetch('/plans/' + id + '/panel', { credentials: 'same-origin' });
            if (!r.ok) throw new Error();
            body.innerHTML = await r.text();       // HTML do server render (đã autoescape)
            if (window.gesTimeTick) window.gesTimeTick();
            if (focusComments) setTimeout(() => $('#ppComments', body)?.scrollIntoView({ behavior: 'smooth' }), 250);
        } catch (e) {
            body.innerHTML = '<div class="text-center py-5 text-muted">Không mở được lịch trình này (có thể đã bị xóa hoặc ở chế độ riêng tư).</div>';
        }
    }

    function openShare(id, hasAttach) {
        shareId = id; shareAttach = !!hasAttach;
        const dl = $('#shDownload');
        dl.disabled = !shareAttach;
        $('#shDownloadSub').textContent = shareAttach ? 'Tệp .pdf / .docx / .xlsx / .pptx do người đăng tải lên' : 'Người dùng này không đăng tệp đính kèm';
        $('#shNote').style.display = shareAttach ? '' : 'none';
        $('#shMsg').textContent = '';
        share.show();
    }

    async function toggleLike(card) {
        if (!AUTH) return needLogin();
        const id = card.dataset.planId;
        const r = await post('/locations/itineraries/' + id + '/like');
        if (!r.ok) return;
        const btn = $('[data-act="like"]', card), n = $('span', btn);
        n.textContent = Math.max(0, parseInt(n.textContent || '0', 10) + (r.data.liked ? 1 : -1));
        btn.classList.toggle('liked', !!r.data.liked);
        $('i', btn).className = 'bi ' + (r.data.liked ? 'bi-heart-fill' : 'bi-heart');
    }

    document.addEventListener('click', function (e) {
        const act = e.target.closest('[data-act]');
        const card = e.target.closest('.pl-card');
        if (act && card) {
            e.stopPropagation();
            const id = card.dataset.planId;
            if (act.dataset.act === 'like') toggleLike(card);
            else if (act.dataset.act === 'comment') openPanel(id, true);
            else if (act.dataset.act === 'share') openShare(id, act.dataset.hasAttach === '1');
            return;
        }
        if (card && !e.target.closest('a')) { openPanel(card.dataset.planId); return; }

        // Bên trong cửa sổ chi tiết
        const pp = e.target.closest('.pp');
        if (!pp) return;
        const id = pp.dataset.planId;
        const tab = e.target.closest('.pp-daytab');
        if (tab) {
            pp.querySelectorAll('.pp-daytab').forEach(t => t.classList.toggle('active', t === tab));
            pp.querySelectorAll('.pp-day').forEach(d => d.classList.toggle('active', d.dataset.dayPane === tab.dataset.day));
            pp.querySelectorAll('.pp-day-side').forEach(d => d.classList.toggle('active', d.dataset.dayPane === tab.dataset.day));
            return;
        }
        const b = e.target.closest('[data-pp]');
        if (!b) return;
        if (b.dataset.pp === 'share') { panel.hide(); openShare(id, pp.dataset.hasAttach === '1'); }
        if (b.dataset.pp === 'save') {
            if (!AUTH) return needLogin();
            post('/locations/itineraries/' + id + '/save').then(r => {
                if (!r.ok) return;
                b.className = 'btn btn-sm rounded-pill px-3 ' + (r.data.saved ? 'btn-primary' : 'btn-outline-secondary');
                b.innerHTML = '<i class="bi ' + (r.data.saved ? 'bi-bookmark-fill' : 'bi-bookmark') + ' me-1"></i><span>' + (r.data.saved ? 'Đã lưu' : 'Lưu') + '</span>';
            });
        }
    });
    document.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('pl-card')) { e.preventDefault(); openPanel(e.target.dataset.planId); }
    });

    // Trả lời 1 bình luận cụ thể trong cửa sổ chi tiết (banner "Đang trả lời ...")
    function ppSetReply(pp, cid, name) {
        const f = $('[data-pp-form="comment"]', pp), prev = $('#ppReplyPrev', pp);
        if (!f || !prev) return;
        $('input[name="parent_id"]', f).value = cid || '';
        if (cid) { $('#ppReplyName', pp).textContent = name || ''; prev.hidden = false; }
        else { prev.hidden = true; }
        $('input[type="text"]', f)?.focus();
    }

    // Thả tim 1 bình luận trong cửa sổ chi tiết
    async function ppToggleCommentLike(btn) {
        if (!AUTH) return needLogin();
        const cid = btn.dataset.cid;
        const r = await post('/locations/api/comments/' + cid + '/like');
        if (!r.ok) return;
        btn.classList.toggle('on', !!r.data.is_liked);
        $('i', btn).className = 'bi ' + (r.data.is_liked ? 'bi-heart-fill' : 'bi-heart');
        $('span', btn).textContent = r.data.likes_count || '';
    }

    document.addEventListener('click', function (e) {
        const pp2 = e.target.closest('.pp');
        if (!pp2) return;
        const likeBtn = e.target.closest('[data-act="cmt-like"]');
        if (likeBtn) { ppToggleCommentLike(likeBtn); return; }
        const replyBtn = e.target.closest('[data-act="cmt-reply"]');
        if (replyBtn) { ppSetReply(pp2, replyBtn.dataset.cid, replyBtn.dataset.name); return; }
        if (e.target.closest('#ppReplyCancel')) { ppSetReply(pp2, null); return; }
    });

    // Gửi bình luận trong cửa sổ chi tiết
    document.addEventListener('submit', async function (e) {
        const f = e.target.closest('[data-pp-form="comment"]');
        if (!f) return;
        e.preventDefault();
        const input = $('input[type="text"]', f), text = input.value.trim();
        if (!text) return;
        const pp = f.closest('.pp');
        const parentId = $('input[name="parent_id"]', f).value || null;
        const r = await post('/locations/itineraries/' + pp.dataset.planId + '/comments', parentId ? { content: text, parent_id: parentId } : { content: text });
        if (!r.ok) return;
        $('#ppNoCmt')?.remove();
        const c = r.data.comment;
        const row = document.createElement('div');
        row.className = 'pp-cmt-item' + (parentId ? ' pp-cmt-reply-item' : '');
        row.dataset.cid = c.id;
        const avatar = c.author_avatar
            ? '<img src="' + c.author_avatar + '" class="pp-cmt-av" alt="">'
            : '<span class="pp-cmt-av pp-av-ph">' + (c.author_username || '?')[0].toUpperCase() + '</span>';
        row.innerHTML =
            '<div class="d-flex gap-2">' + avatar +
            '<div class="flex-grow-1" style="min-width:0;">' +
            '<div class="pp-cmt-box">' +
            '<div class="comment-name"><a href="/profile/' + c.author_username + '" class="text-decoration-none fw-bold"></a></div>' +
            '<div class="comment-text"></div>' +
            '</div>' +
            '<div class="pp-cmt-actions"><span class="pp-muted">Vừa xong</span>' +
            '<button type="button" class="pp-cmt-like" data-act="cmt-like" data-cid="' + c.id + '"><i class="bi bi-heart"></i> <span></span></button>' +
            '<button type="button" class="pp-cmt-reply-btn" data-act="cmt-reply" data-cid="' + c.id + '" data-name="' + c.author_username + '">Trả lời</button>' +
            '</div></div></div>';
        row.querySelector('.comment-name a').textContent = c.author_username;   // textContent: không chèn HTML
        const textEl = row.querySelector('.comment-text');
        if (c.reply_to_name) {
            const m = document.createElement('a');
            m.className = 'reply-mention';
            m.href = '/profile/' + encodeURIComponent(c.reply_to_username || '');
            m.textContent = '@' + c.reply_to_name;
            textEl.appendChild(m);
            textEl.appendChild(document.createTextNode(' '));
        }
        textEl.insertAdjacentHTML('beforeend', c.content_html || '');   // content_html do SERVER dựng (đã escape + gắn link @mention)
        if (parentId) {
            let wrap = $('.pp-cmt-item[data-cid="' + parentId + '"]', $('#ppCmtList')).nextElementSibling;
            if (!wrap || !wrap.classList.contains('pp-cmt-replies')) {
                wrap = document.createElement('div'); wrap.className = 'pp-cmt-replies';
                $('.pp-cmt-item[data-cid="' + parentId + '"]').insertAdjacentElement('afterend', wrap);
            }
            wrap.appendChild(row);
        } else {
            $('#ppCmtList').appendChild(row);
        }
        input.value = '';
        ppSetReply(pp, null);
    });

    // Cửa sổ chia sẻ
    $('#shDownload').addEventListener('click', function () { if (shareAttach) location.href = '/plans/' + shareId + '/attachment'; });
    $('#shCopy').addEventListener('click', async function () {
        const url = location.origin + '/plans/' + shareId;
        try { await navigator.clipboard.writeText(url); $('#shMsg').textContent = 'Đã sao chép liên kết.'; if (window.gesToast) gesToast('Đã sao chép liên kết lịch trình!'); }
        catch (e) { $('#shMsg').textContent = url; }
    });
    $('#shRepost').addEventListener('click', async function () {
        if (!AUTH) return needLogin();
        const r = await post('/plans/' + shareId + '/repost');
        $('#shMsg').textContent = r.data.message || r.data.error || 'Không thực hiện được.';
        if (r.ok && !r.data.already) {
            const c = document.querySelector('.pl-card[data-plan-id="' + shareId + '"] [data-act="share"] span');
            if (c) c.textContent = parseInt(c.textContent || '0', 10) + 1;
        }
    });
    // Vừa đăng xong (?open=<id>): mở luôn cửa sổ chi tiết của lịch trình mới, rồi bỏ tham số khỏi thanh địa chỉ
    try {
        const q = new URLSearchParams(location.search), oid = q.get('open');
        if (oid && /^\d+$/.test(oid)) {
            openPanel(oid);
            q.delete('open');
            history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q.toString() : '') + location.hash);
        }
    } catch (e) {}

    // ---------- Emoji picker cho Lịch trình ----------
    window.togglePlanEmojiPicker = function(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const p = document.getElementById('planEmojiPicker');
        if (p) p.classList.toggle('d-none');
    };

    window.insertPlanEmoji = function(emoji) {
        const input = document.getElementById('ppCommentInput');
        if (!input) return;
        const start = input.selectionStart !== undefined ? input.selectionStart : input.value.length;
        const end = input.selectionEnd !== undefined ? input.selectionEnd : input.value.length;
        const text = input.value;
        input.value = text.substring(0, start) + emoji + text.substring(end);
        input.selectionStart = input.selectionEnd = start + emoji.length;
        input.focus();
        const p = document.getElementById('planEmojiPicker');
        if (p) p.classList.add('d-none');
    };

    document.addEventListener('click', function(e) {
        const picker = document.getElementById('planEmojiPicker');
        if (picker && !picker.classList.contains('d-none')) {
            if (!e.target.closest('#planEmojiPicker') && !e.target.closest('.cmt-emoji-btn')) {
                picker.classList.add('d-none');
            }
        }
    });

})();
</script>
