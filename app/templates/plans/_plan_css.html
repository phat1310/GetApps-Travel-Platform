<style>
    .pl-wrap { max-width: 980px; margin: 0 auto; }
    .pl-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .pl-head h1 { font-size: 1.35rem; font-weight: 800; margin: 0; }

    /* Thanh lọc gọn 1 hàng */
    .pl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; padding: 8px 10px; margin-bottom: 16px;
              background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 14px; }
    .pl-bar .dropdown { flex: 0 0 auto; }
    .pl-fbtn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: .84rem; font-weight: 600; white-space: nowrap;
               border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); color: var(--bs-body-color); border-radius: 999px; }
    .pl-fbtn:hover { border-color: var(--ges-primary); color: var(--ges-primary); }
    .pl-fbtn.on { background: var(--ges-primary); border-color: var(--ges-primary); color: #fff; }
    .pl-menu { min-width: 210px; max-height: 320px; overflow-y: auto; font-size: .86rem; border-radius: 12px; }
    .pl-menu .dropdown-item { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-radius: 8px; }
    .pl-menu .dropdown-item.sel { background: rgba(22,159,227,.14); color: var(--ges-primary); font-weight: 700; }
    .pl-menu .cnt { font-size: .74rem; opacity: .7; }
    .pl-search { margin-left: auto; position: relative; flex: 1 1 150px; max-width: 250px; min-width: 120px; }
    .pl-search input { width: 100%; padding: 6px 12px 6px 32px; font-size: .84rem; border-radius: 999px; border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); color: var(--bs-body-color); }
    .pl-search i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .55; font-size: .85rem; }
    .pl-clear { flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
                border: 1px solid var(--bs-border-color); color: var(--bs-secondary-color); text-decoration: none; }
    .pl-clear:hover { color: #dc3545; border-color: #dc3545; }

    /* Mỗi lịch trình 1 hàng */
    .pl-list { display: flex; flex-direction: column; gap: 14px; }
    .pl-card { display: flex; background: var(--bs-body-bg); border: 1px solid var(--bs-border-color); border-radius: 16px; overflow: hidden; cursor: pointer;
               transition: box-shadow .2s, transform .2s; }
    .pl-card:hover { box-shadow: 0 10px 22px -8px rgba(0,0,0,.18); transform: translateY(-2px); }
    .pl-cover { position: relative; flex: 0 0 300px; min-height: 190px; background: #0f172a; }
    .pl-cover > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .pl-cover::after { content: ""; position: absolute; inset: auto 0 0 0; height: 70px; background: linear-gradient(transparent, rgba(0,0,0,.65)); pointer-events: none; }
    .pl-react { position: absolute; left: 10px; bottom: 8px; z-index: 2; display: flex; gap: 12px; color: #fff; font-size: .82rem; }
    .pl-react button { background: none; border: 0; color: #fff; padding: 2px 0; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
    .pl-react button i { font-size: 1.05rem; }
    .pl-react button.liked i { color: #ff4d6d; }
    .pl-info { flex: 1; min-width: 0; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
    .pl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
    .pl-author { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; max-width: 45%;
                 font-size: .82rem; font-weight: 700; color: var(--bs-body-color); text-decoration: none; }
    .pl-author:hover { color: var(--ges-primary); }
    .pl-author span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pl-av { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex: 0 0 26px; }
    .pl-av-ph { background: var(--ges-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 700; }
    .pl-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .pl-badge { font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(22,159,227,.14); color: var(--ges-primary); }
    .pl-badge.priv { background: rgba(108,117,125,.18); color: var(--bs-secondary-color); }
    .pl-title { font-size: 1.08rem; font-weight: 800; margin: 0; overflow-wrap: anywhere; }
    .pl-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .85rem; color: var(--bs-secondary-color); }
    .pl-price { font-weight: 800; color: #16a34a; font-size: .95rem; }
    .pl-time { margin-top: auto; align-self: flex-end; font-size: .74rem; color: var(--bs-secondary-color); }

    .pl-empty { text-align: center; padding: 70px 10px; color: var(--bs-secondary-color); font-size: 1.05rem; font-weight: 600; }
    .pl-empty i { font-size: 2.4rem; display: block; margin-bottom: 8px; opacity: .45; }

    @media (max-width: 640px) {
        .pl-bar { flex-wrap: wrap; }
        .pl-search { max-width: none; flex-basis: 100%; order: 9; margin-left: 0; }
        .pl-card { flex-direction: column; }
        .pl-cover { flex-basis: auto; min-height: 190px; }
    }

    /* ===== Cửa sổ chi tiết ===== */
    #planPanel .modal-dialog { max-width: 900px; }
    #planPanel .modal-content { border-radius: 18px; overflow: hidden; border: 0; }
    #planPanel .pp-close { position: absolute; top: 12px; right: 12px; z-index: 5; }
    .pp-hero { position: relative; height: 260px; background: #0f172a; }
    .pp-hero img { width: 100%; height: 100%; object-fit: cover; }
    .pp-hero-shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.72)); }
    .pp-hero-top { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; }
    .pp-badge { background: var(--ges-primary); color: #fff; font-size: .75rem; font-weight: 700; padding: 4px 12px; border-radius: 999px; }
    .pp-badge-dark { background: rgba(15,23,42,.75); }
    .pp-hero-bottom { position: absolute; left: 20px; right: 20px; bottom: 16px; color: #fff; }
    .pp-title { font-weight: 800; margin: 0 0 6px; overflow-wrap: anywhere; }
    .pp-sub { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .86rem; opacity: .95; }
    .pp-body { padding: 18px 22px 24px; }
    .pp-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .pp-stat { border: 1px solid var(--bs-border-color); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 1px; }
    .pp-stat i { color: var(--ges-primary); }
    .pp-stat b { font-size: .98rem; }
    .pp-stat span { font-size: .72rem; color: var(--bs-secondary-color); }
    .pp-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .pp-time { font-size: .76rem; color: var(--bs-secondary-color); }
    .pp-desc { color: var(--bs-secondary-color); white-space: pre-line; font-size: .92rem; }
    .pp-h { font-weight: 800; margin: 18px 0 8px; }
    .pp-card { border: 1px solid var(--bs-border-color); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .pp-muted { color: var(--bs-secondary-color); }
    .pp-daytabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
    .pp-daytab { border: 1px solid var(--bs-border-color); background: var(--bs-body-bg); color: var(--bs-body-color); border-radius: 999px; padding: 5px 14px; font-size: .84rem; font-weight: 600; white-space: nowrap; }
    .pp-daytab.active { background: var(--ges-primary); border-color: var(--ges-primary); color: #fff; }
    .pp-day { display: none; padding-top: 8px; }
    .pp-day.active { display: block; }
    .pp-daytitle { font-weight: 700; margin-bottom: 6px; }
    .pp-stop { display: flex; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--bs-border-color); }
    .pp-stop:first-of-type { border-top: 0; }
    .pp-dot { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--ges-primary); color: #fff; font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .pp-stop-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .pp-author { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--bs-border-color); }
    .pp-av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; }
    .pp-av-ph { background: var(--ges-primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
    .pp-cmt { font-size: .88rem; padding: 4px 0; overflow-wrap: anywhere; }
    .pp-cmt-form { display: flex; gap: 8px; margin-top: 8px; }
    @media (max-width: 640px) { .pp-stats { grid-template-columns: repeat(2, 1fr); } .pp-hero { height: 210px; } }

    /* ===== Cửa sổ chia sẻ ===== */
    #planShare .modal-dialog { max-width: 380px; }
    #planShare .modal-content { border-radius: 18px; }
    .sh-opt { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; margin-bottom: 8px;
              border: 1px solid var(--bs-border-color); border-radius: 12px; background: var(--bs-body-bg); color: var(--bs-body-color); }
    .sh-opt:hover:not(:disabled) { border-color: var(--ges-primary); }
    .sh-opt:disabled { opacity: .55; cursor: not-allowed; }
    .sh-opt i { font-size: 1.3rem; color: var(--ges-primary); }
    .sh-opt small { display: block; color: var(--bs-secondary-color); font-size: .74rem; }
</style>
