{# Modal xem nhanh chi tiết 1 lịch trình (ảnh bìa + mô tả + khóa/xóa).
   Dùng chung bởi app/templates/admin/itineraries.html, điền dữ liệu qua JS
   (static/js/admin_itinerary_modal.js) gọi JSON từ route admin.itinerary_detail. #}
<div class="modal fade" id="itineraryDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background:#1e293b;color:#e2e8f0;border-color:#334155;">
            <div class="modal-header" style="border-color:#334155;">
                <h5 class="modal-title"><i class="bi bi-map"></i> Lịch trình <span id="idm-id"></span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="small text-secondary mb-2">
                    <i class="bi bi-person-fill"></i> <span id="idm-author"></span>
                    &middot; <i class="bi bi-clock"></i> <span id="idm-created"></span>
                    &middot; <span class="badge bg-secondary" id="idm-visibility"></span>
                    &middot; <i class="bi bi-chat-fill"></i> <span id="idm-comment-count"></span> bình luận
                    &middot; <i class="bi bi-calendar3"></i> <span id="idm-days"></span> ngày
                </div>
                <div id="idm-cover" class="mb-3"></div>
                <h6 id="idm-title" class="fw-bold mb-1"></h6>
                <div class="small text-secondary mb-2"><i class="bi bi-geo-alt-fill"></i> <span id="idm-destination"></span></div>
                <p id="idm-description" class="mb-0" style="white-space: pre-wrap;"></p>
            </div>
            <div class="modal-footer" style="border-color:#334155;">
                <form method="post" id="idm-form-hide" data-base="{{ url_for('admin.toggle_hide_itinerary', itinerary_id=0) }}" class="d-inline">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-outline-warning"><i class="bi bi-lock-fill"></i> Khóa</button>
                </form>
                <form method="post" id="idm-form-delete" data-base="{{ url_for('admin.delete_itinerary', itinerary_id=0) }}" class="d-inline"
                      onsubmit="return confirm('Xóa vĩnh viễn lịch trình này? Người đăng sẽ nhận được thông báo.');">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-outline-light"><i class="bi bi-trash"></i> Xóa</button>
                </form>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            </div>
        </div>
    </div>
</div>
