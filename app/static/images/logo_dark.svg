<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="100%" height="100%">
  <defs>
    <style>
      .brand-letter-g-dark, .brand-letter-e-dark {
        fill: #FFFFFF;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 64px;
      }
      .brand-letter-s-dark {
        fill: #0EA5E9;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 800;
        font-size: 64px;
      }
      .tagline-dark {
        fill: #94A3B8;
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 5px;
      }
      .pin-bg-dark {
        fill: #0EA5E9;
      }
      .pin-inner-dark {
        fill: #111827;
      }
      .paper-plane-dark {
        fill: #0EA5E9;
      }
      .plane-shadow-dark {
        fill: #0284C7;
      }
    </style>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Letter G -->
    <text x="5" y="58" class="brand-letter-g-dark">G</text>

    <!-- Location Pin inside G -->
    <g transform="translate(26, 26) scale(0.85)">
      <path class="pin-bg-dark" d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8z"/>
      <circle class="pin-inner-dark" cx="12" cy="10" r="3.2"/>
    </g>

    <!-- Letter E -->
    <text x="66" y="58" class="brand-letter-e-dark">E</text>

    <!-- Letter s -->
    <text x="114" y="58" class="brand-letter-s-dark">s</text>

    <!-- Paper Plane above letter 's' -->
    <g transform="translate(138, 2) rotate(-5) scale(1.15)">
      <path class="paper-plane-dark" d="M0 16 L24 0 L15 22 L10 16 Z"/>
      <path class="plane-shadow-dark" d="M10 16 L15 22 L11 25 L8 19 Z"/>
      <path fill="#38BDF8" d="M0 16 L24 0 L10 16 Z"/>
    </g>

    <!-- Tagline: Get · Explore · Share -->
    <text x="16" y="78" class="tagline-dark">Get · Explore · Share</text>
  </g>
</svg>
