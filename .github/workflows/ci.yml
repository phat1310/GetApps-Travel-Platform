name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret
      JWT_SECRET_KEY: ci-test-jwt-secret
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
    steps:
      - uses: actions/checkout@v4
      - name: Dam bao .env khong bi day len Git
        run: test -z "$(git ls-files .env)" || (echo ".env dang nam trong Git!" && exit 1)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/Report/requirements.txt
      - name: Cai thu vien
        run: pip install -r app/Report/requirements.txt
      - name: Kiem tra app khoi dong duoc
        run: python -c "import run; print('App khoi dong OK')"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t getapps:ci .